name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # The worked example, shared by several jobs. Kept here so a change to it is
  # one edit rather than five.
  OBJECTIVES: examples/objectives.yaml
  PRICES: examples/prices.yaml
  WINDOWS: examples/windows

jobs:
  quality:
    name: Lint, format, types, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --locked --group dev --group docs

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Build the documentation site
        # The builder fails on a broken internal link, so a renamed page fails
        # the pull request rather than shipping a 404.
        run: uv run --only-group docs python scripts/build_site.py --output _site

  test:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every marker declared in pyproject.toml. A layer that exists and is
        # never selected is a layer nobody runs.
        layer: [unit, integration, security, e2e, meta]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: pytest -m ${{ matrix.layer }}
        # Bare, with no coverage flag: a matrix leg that inherited the coverage
        # gate would fail on every leg but the full one, for a reason that has
        # nothing to do with the layer it is reporting on.
        run: uv run pytest -m ${{ matrix.layer }} -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: Full suite with the coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  gates:
    name: The tool gates its own example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: doctor
        run: uv run llmops doctor --window "$WINDOWS/steady.jsonl.gz"

      - name: The committed corpus still matches its scenarios
        # Catches a corpus regenerated by a different build, or edited by hand.
        #
        # Not "regenerate and git diff": that compares bytes, and bytes carry
        # things a report does not read. This compares the digest, which is
        # over the spans' billable and measurable facts — exactly what a gate
        # consults, and nothing it ignores.
        run: |
          for scenario in steady outage slowdown cost-spike; do
            uv run llmops check --scenario "$scenario" \
              --window "$WINDOWS/$scenario.jsonl.gz"
          done

      - name: The healthy window holds
        # The control. Without a green control the red results below could be
        # facts about the tool rather than about the incidents.
        run: |
          uv run llmops gate \
            --window "$WINDOWS/steady.jsonl.gz" \
            --objectives "$OBJECTIVES" --pricebook "$PRICES" \
            --with-cost \
            --json-out reports/slo.json \
            --junit-out reports/slo.xml \
            --markdown-out reports/slo.md

      - name: Every incident fires, for the right reason, and only it
        # Asserts exit 2 specifically — 3 would mean the tool broke — that
        # exactly the expected objective is breached and no other, and that the
        # healthy window is still green at the same instant. The third check is
        # the one that is easy to leave out and the one that carries the
        # argument: without it, "the gate fired at 22:40" could be a fact about
        # 22:40.
        run: uv run python scripts/check-incidents.py

      - name: Publish the summary
        if: always()
        run: cat reports/slo.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slo-reports
          path: reports/
          if-no-files-found: error

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Run every example
        # They are documentation that executes. One that stops working is a
        # README that lies.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/burnrate_demo.py
          uv run python examples/cardinality_demo.py

  build:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build the wheel and sdist
        run: uv build

      - name: The wheel installs and its console script works
        # Building is not the same as being installable. This catches a missing
        # package directory or a broken entry point, which a source checkout
        # never notices.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/llmops --version
          /tmp/verify/bin/llmops doctor

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
